name: Desktop installers

# Builds the Cutroom desktop app for Windows, macOS and Linux and publishes the installers as a GitHub release.
# Installed apps check this repo's latest release and update themselves, so every build gets a version higher than the last:
#   - push a tag like v1.2.0                  → release v1.2.0 (exactly that version)
#   - push to main / the branch below / Run workflow → release v0.1.<run number> (a new patch version each time)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main', 'claude/relaxed-bohr-gbks6j']
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write # publish the installers on the release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.${GITHUB_RUN_NUMBER}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "::error::'$v' is not a version like 1.2.3"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Linux only: start the packaged app headless and check the window, server, bundled FFmpeg and native bridge
      - name: Smoke test
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          node desktop/build.mjs smoke

      - name: Build installer
        run: node desktop/build.mjs dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds: do not go looking for a signing certificate
          CUTROOM_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: cutroom-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  # one job publishes, after every build has finished, so the release is created exactly once
  release:
    needs: [version, build]
    # publish whatever built, even if one platform failed
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Cutroom ${{ needs.version.outputs.version }}
          make_latest: true
          body: |
            Desktop app for Windows, macOS and Linux — download, install, run. FFmpeg is included; nothing else to install.

            | OS | File |
            |---|---|
            | Windows | `Cutroom-*-win-x64.exe` |
            | macOS | `Cutroom-*-mac-*.dmg` |
            | Linux | `Cutroom-*-linux-*.AppImage` (then `chmod +x` and run) |

            The installers are not code-signed: on Windows choose **More info → Run anyway**; on macOS right-click the app → **Open**.

            Installed Windows and Linux (AppImage) apps update themselves from this release. macOS builds are unsigned, so there the app tells you about a new version and you download it here.
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.AppImage
            installers/latest*.yml
            installers/*.blockmap
